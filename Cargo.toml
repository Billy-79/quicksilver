[package]
name = "quicksilver"
version = "0.2.0"
edition = "2021"
authors = ["Billy-79"]

[[bin]]
name = "qs"
path = "src/main.rs"

[dependencies]
ratatui = "0.26.3"
crossterm = "0.27.0"
serde = { version = "1.0", features = ["derive"] }
dirs = "5.0"
toml = "0.8"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
